[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.5.3"
axum = "0.8.1"
dotenvy = "0.15.7"
hex = "0.4.3"
rand = "0.8.4"
serde = { version = "1.0.218", features = ["derive"] }
sqlx = { version = "0.8.3", features = [
	"runtime-tokio",
	"tls-rustls-ring-webpki",
	"mysql",
] }
tokio = { version = "1.44.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace", "cors"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
