[package]
name = "service"
version = "0.1.0"
edition = "2024"

[dependencies]
sea-orm = { version = "1.1.7", features = [
	"sqlx-mysql",
	"runtime-tokio-rustls",
] }
entity = { path = "../entity" }
rand = "0.9.0"
hex = "0.4.3"
jsonwebtoken = "9.3.1"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.44.1", features = ["full"] }
thiserror = "2.0.12"
